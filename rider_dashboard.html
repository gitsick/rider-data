function cards(a){const t=a.length,hd=a.filter(r=>r['区域']==='华东').length,hs=t-hd;const c=[...new Set(a.map(r=>r['市/区县']).filter(Boolean))].length;const st=[...new Set(a.map(r=>r['站点']).filter(Boolean))].length;const hp=t>0?(hd/t*100).toFixed(1):0;const sp=t>0?(hs/t*100).toFixed(1):0;const hcd=[...new Set(a.filter(r=>r['区域']==='华东').map(r=>r['市/区县']).filter(Boolean))].length;const scd=[...new Set(a.filter(r=>r['区域']==='华南').map(r=>r['市/区县']).filter(Boolean))].length;const rr={};a.forEach(r=>rr[r['解除合作原因']]=(rr[r['解除合作原因']]||0)+1);const sorted=Object.entries(rr).sort((x,y)=>y[1]-x[1]);const top=sorted[0];const tp=top?t>0?(top[1]/t*100).toFixed(1):0:0;const dx={};a.forEach(r=>dx[r['解除合作去向']]=(dx[r['解除合作去向']]||0)+1);const topdx=Object.entries(dx).sort((x,y)=>y[1]-x[1])[0];document.getElementById('statCards').innerHTML='<div class="card"><div class="num">'+t+'</div><div class="lbl">登记总数</div><div class="pct">'+st+' 个站点</div></div><div class="card hd"><div class="num">'+hd+'</div><div class="lbl">华东</div><div class="pct">'+hp+'% · '+hcd+'市</div></div><div class="card hs"><div class="num">'+hs+'</div><div class="lbl">华南</div><div class="pct">'+sp+'% · '+scd+'市</div></div><div class="card"><div class="num">'+c+'</div><div class="lbl">覆盖市/区县</div><div class="pct">'+st+' 个站点</div></div><div class="card"><div class="num" style="font-size:13px">'+(top?top[0]:'-')+'</div><div class="lbl">最高频原因</div><div class="pct">'+(top?top[1]+'人 · '+tp+'%':'-')+'</div></div><div class="card"><div class="num" style="font-size:13px">'+(topdx?topdx[0]:'-')+'</div><div class="lbl">主要去向</div><div class="pct">'+(topdx&&t>0?(topdx[1]/t*100).toFixed(0)+'%':'-')+'</div></div>';}
function reasonColor(k){if(k.indexOf('主动提离职')>=0||k.indexOf('到期')>=0)return '#FFC300';if(k.indexOf('迭代')>=0||k.indexOf('劝退')>=0)return '#FA8C16';if(k.indexOf('失联')>=0||k.indexOf('急辞')>=0)return '#F5222D';if(k.indexOf('伤病')>=0||k.indexOf('事故')>=0)return '#FF4D4F';if(k.indexOf('兼职')>=0||k.indexOf('暑假')>=0)return '#722ED1';return '#8A8FA3'}
function renderReasons(a){const rr={};a.forEach(r=>rr[r['解除合作原因']]=(rr[r['解除合作原因']]||0)+1);const sorted=Object.entries(rr).sort((x,y)=>y[1]-x[1]);const tot=a.length||1;const max=sorted.length?sorted[0][1]:1;document.getElementById('reasonsBar').innerHTML=sorted.map(function(e){const pct=(e[1]/tot*100).toFixed(1);const w=e[1]/max*100;const col=reasonColor(e[0]);return '<div class="reasons-row"><span class="rk" title="'+e[0]+'">'+e[0]+'</span><div class="bar"><div class="bar-fill" style="width:'+w+'%;background:linear-gradient(90deg,'+col+','+col+'cc)"></div><span style="position:absolute;right:6px;top:1px;font-size:11px;font-weight:600;color:#1B1B33;">'+pct+'%</span></div><span class="rv">'+e[1]+'人</span></div>'}).join('');}
function renderCharts(a){function build(elId,key,topN,activeVal,colorFn){const m={};a.forEach(r=>{const v=r[key];if(v)m[v]=(m[v]||0)+1});const sorted=Object.entries(m).sort((x,y)=>y[1]-x[1]);const tot=a.length||1;const max=sorted.length?sorted[0][1]:1;const top=sorted.slice(0,topN);const el=document.getElementById(elId);const cnt=document.getElementById(elId.replace('chart','cnt'));if(cnt)cnt.textContent=sorted.length+'项';if(!top.length){el.innerHTML='<div class="cbar-empty">暂无数据</div>';return}el.innerHTML=top.map(function(e){const w=e[1]/max*100;const pct=(e[1]/tot*100).toFixed(1);const col=colorFn?colorFn(e[0]):'#FFC300';const act=activeVal===e[0]?' active':'';return '<div class="cbar-row'+act+'" onclick="chartClick(\''+key+'\',\''+e[0].replace(/'/g,'\\\'')+'\')" title="'+e[0]+' · '+e[1]+'人 ('+pct+'%)"><span class="ck">'+e[0]+'</span><div class="cbar"><div class="cbar-fill" style="width:'+w+'%;background:linear-gradient(90deg,'+col+','+col+'cc)"></div><span style="position:absolute;right:4px;top:0;font-size:10px;font-weight:600;color:#1B1B33;">'+pct+'%</span></div><span class="cv">'+e[1]+'</span></div>'}).join('')+((sorted.length>topN)?'<div style="text-align:center;font-size:10px;color:#B0B4C0;padding:4px 0">还有'+(sorted.length-topN)+'项...</div>':'')}
var fr=document.getElementById('fRegion').value,fc=document.getElementById('fCity').value,fst=document.getElementById('fStation').value;
var secR=document.getElementById('secRegion'),secC=document.getElementById('secCity'),secS=document.getElementById('secStation'),grid=document.getElementById('chartsGrid');
var tR=document.getElementById('titleRegion'),tC=document.getElementById('titleCity'),tS=document.getElementById('titleStation');
grid.style.gridTemplateColumns='1fr 1fr';
if(!fr){secR.style.display='';secC.style.display='none';secS.style.display='none';tR.innerHTML='区域分布 <span class="cnt" id="cntRegion"></span>';build('chartRegion','区域',50,fr,function(k){return k==='华东'?'#52C41A':'#FA8C16'});}
else if(!fc){secR.style.display='none';secC.style.display='';secS.style.display='none';tC.innerHTML=fr+' · 市/区县分布 <span class="cnt" id="cntCity"></span>';build('chartCity','市/区县',50,fc,function(k){return '#1890FF'});}
else{secR.style.display='none';secC.style.display='none';secS.style.display='';tS.innerHTML=fr+' · '+fc+' · 站点分布 <span class="cnt" id="cntStation"></span>';build('chartStation','站点',50,fst,function(k){return '#722ED1'});}}
function chartClick(key,val){if(key==='区域'){var el=document.getElementById('fRegion');el.value=el.value===val?'':val}else if(key==='市/区县'){var el=document.getElementById('fCity');el.value=el.value===val?'':val;autoFillRegion(el.value)}else if(key==='站点'){var el=document.getElementById('fStation');el.value=el.value===val?'':val;autoFillCityRegion(el.value)}updateFilters();page=1;render();}
function fill(sel,key,ph,data){data=data||DATA;const s=document.getElementById(sel);s.innerHTML='<option value="">'+ph+'</option>';[...new Set(data.map(r=>r[key]).filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});}
function dateStrToTs(s){if(!s)return 0;const d=s.split('-');return Date.UTC(+d[0],(+d[1]||1)-1,+d[2]||1,0,0,0)}
function autoFillRegion(cityVal){if(!cityVal)return;const m=DATA.find(r=>r['市/区县']===cityVal);if(m&&m['区域'])document.getElementById('fRegion').value=m['区域'];}
function autoFillCityRegion(stVal){if(!stVal)return;const m=DATA.find(r=>r['站点']===stVal);if(m){if(m['区域'])document.getElementById('fRegion').value=m['区域'];if(m['市/区县'])document.getElementById('fCity').value=m['市/区县'];}}
function updateFilters(){const fr=document.getElementById('fRegion').value;const fc=document.getElementById('fCity').value;const fst=document.getElementById('fStation').value;const fs=document.getElementById('fReason').value;let rd=DATA;if(fr)rd=rd.filter(r=>r['区域']===fr);const cities=[...new Set(rd.map(r=>r['市/区县']).filter(Boolean))].sort();const cs=document.getElementById('fCity');const keepCity=cities.includes(fc);cs.innerHTML='<option value="">全部市/区县</option>'+cities.map(c=>'<option value="'+c+'"'+(c===fc?' selected':'')+'>'+c+'</option>').join('');if(!keepCity)cs.value='';let cd=rd;const nc=cs.value;if(nc)cd=cd.filter(r=>r['市/区县']===nc);const stations=[...new Set(cd.map(r=>r['站点']).filter(Boolean))].sort();const ss=document.getElementById('fStation');const keepStation=stations.includes(fst);ss.innerHTML='<option value="">全部站点</option>'+stations.map(s=>'<option value="'+s+'"'+(s===fst?' selected':'')+'>'+s+'</option>').join('');if(!keepStation)ss.value='';let sd=cd;const nst=ss.value;if(nst)sd=sd.filter(r=>r['站点']===nst);const reasons=[...new Set(sd.map(r=>r['解除合作原因']).filter(Boolean))].sort();const rs=document.getElementById('fReason');const keepReason=reasons.includes(fs);rs.innerHTML='<option value="">全部解除原因</option>'+reasons.map(r=>'<option value="'+r+'"'+(r===fs?' selected':'')+'>'+r+'</option>').join('');if(!keepReason)rs.value='';}
let sortKey='提交时间',sortDir=-1,page=1,pageSize=15;
function toTs(v){if(!v)return 0;const p=String(v).trim().split(/\s+/);const d=(p[0]||'0/0/0').split('/');const t=p[1]?p[1].split(':').map(Number):[0,0,0];return Date.UTC(+d[0],(+d[1]||1)-1,+d[2]||1,t[0]||0,t[1]||0,t[2]||0)}
function updateSortHeaders(){document.querySelectorAll('th').forEach(th=>{th.classList.remove('sort-asc','sort-desc');if(th.dataset.key===sortKey){th.classList.add(sortDir>0?'sort-asc':'sort-desc')}});}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const fr=document.getElementById('fRegion').value,fc=document.getElementById('fCity').value,fst=document.getElementById('fStation').value,fs=document.getElementById('fReason').value;const fsS=document.getElementById('fSubmitStart').value,fsE=document.getElementById('fSubmitEnd').value,feS=document.getElementById('fEndStart').value,feE=document.getElementById('fEndEnd').value;let l=DATA.filter(r=>{if(fr&&r['区域']!==fr)return false;if(fc&&r['市/区县']!==fc)return false;if(fst&&r['站点']!==fst)return false;if(fs&&r['解除合作原因']!==fs)return false;if(fsS&&toTs(r['提交时间'])<dateStrToTs(fsS))return false;if(fsE&&toTs(r['提交时间'])>dateStrToTs(fsE)+86399999)return false;if(feS&&toTs(r['预计解除合作时间'])<dateStrToTs(feS))return false;if(feE&&toTs(r['预计解除合作时间'])>dateStrToTs(feE)+86399999)return false;if(q){const hay=Object.values(r).join(' ').toLowerCase();if(hay.indexOf(q)<0)return false;}return true;});if(sortKey)l=[...l].sort((a,b)=>{if(sortKey==='提交时间'||sortKey==='入职时间'||sortKey==='预计解除合作时间'){return (toTs(a[sortKey])-toTs(b[sortKey]))*sortDir}return String(a[sortKey]).localeCompare(String(b[sortKey]),'zh',{numeric:true})*sortDir});curRows=l;cards(l);renderReasons(l);renderCharts(l);const ttl=l.length,tp=Math.max(1,Math.ceil(ttl/pageSize));if(page>tp)page=tp;if(page<1)page=1;const st=(page-1)*pageSize,sl=l.slice(st,st+pageSize);const tb=document.getElementById('tbody');tb.innerHTML=sl.length?sl.map((p,i)=>'<tr><td><span class="tag '+(p['区域']==='华东'?'hd':'hs')+'">'+p['区域']+'</span></td><td>'+p['提交时间']+'</td><td>'+p['来源']+'</td><td>'+p['来自IP']+'</td><td><b>'+p['市/区县']+'</b></td><td>'+p['站点']+'</td><td>'+(p['解除协议']&&p['解除协议'].indexOf('http')===0?'<a class="nm-link" onclick="viewAgreement('+(st+i)+')">'+p['骑手姓名']+'</a>':p['骑手姓名'])+'</td><td>'+p['骑手ID']+'</td><td>'+p['联系方式']+'</td><td>'+p['入职时间']+'</td><td>'+p['预计解除合作时间']+'</td><td>'+p['解除合作原因']+'</td><td>'+p['解除合作去向']+'</td></tr>').join(''):'<tr><td colspan="13" class="empty">无匹配记录</td></tr>';var chips='';if(fr)chips+='<span class="fchip c-region" onclick="clr(\'fRegion\')"><span class="fk">区域</span><span class="fv">'+fr+'</span><span class="fx">×</span></span>';if(fc)chips+='<span class="fchip c-city" onclick="clr(\'fCity\')"><span class="fk">市/区县</span><span class="fv">'+fc+'</span><span class="fx">×</span></span>';if(fst)chips+='<span class="fchip c-station" onclick="clr(\'fStation\')"><span class="fk">站点</span><span class="fv">'+fst+'</span><span class="fx">×</span></span>';if(fsS||fsE)chips+='<span class="fchip c-date" onclick="clr(\'fSubmitStart\');clr(\'fSubmitEnd\')"><span class="fk">📅提交</span><span class="fv">'+(fsS||'?')+' ~ '+(fsE||'?')+'</span><span class="fx">×</span></span>';if(feS||feE)chips+='<span class="fchip c-date" onclick="clr(\'fEndStart\');clr(\'fEndEnd\')"><span class="fk">📅解除</span><span class="fv">'+(feS||'?')+' ~ '+(feE||'?')+'</span><span class="fx">×</span></span>';if(fs)chips+='<span class="fchip c-reason" onclick="clr(\'fReason\')"><span class="fk">原因</span><span class="fv">'+fs+'</span><span class="fx">×</span></span>';if(q)chips+='<span class="fchip c-search" onclick="clr(\'search\')"><span class="fk">🔍</span><span class="fv">'+q+'</span><span class="fx">×</span></span>';var hasFilter=fr||fc||fst||fsS||fsE||feS||feE||fs||q;var clrBtn=hasFilter?'<span class="fs-clear" onclick="reset()">清除全部</span>':'';document.getElementById('meta').innerHTML='<span class="fs-count">筛选结果 <span class="num">'+ttl+'</span> 条</span><span class="fs-label">· 第'+page+'/'+tp+'页 · 显示'+sl.length+'条</span>'+chips+clrBtn;let h='<button class="pbtn" '+(page<=1?'disabled':'')+' onclick="go(1)">\u00ab</button><button class="pbtn" '+(page<=1?'disabled':'')+' onclick="go('+(page-1)+')">\u2039上一页</button>';for(let i=Math.max(1,page-2);i<=Math.min(tp,page+2);i++){h+='<button class="pbtn '+(i===page?'cur':'')+'" onclick="go('+i+')">'+i+'</button>';}h+='<button class="pbtn" '+(page>=tp?'disabled':'')+' onclick="go('+(page+1)+')">下一页\u203a</button><button class="pbtn" '+(page>=tp?'disabled':'')+' onclick="go('+tp+')">\u00bb</button><span class="pinfo">共 '+ttl+' 条 · '+page+'/'+tp+'</span>';document.getElementById('pager').innerHTML=h;updateSortHeaders();}
function clr(id){var el=document.getElementById(id);if(!el)return;if(el.tagName==='SELECT'){el.value='';if(id==='fRegion'){document.getElementById('fCity').value='';document.getElementById('fStation').value='';}if(id==='fCity'){document.getElementById('fStation').value='';}updateFilters();}else{el.value='';}page=1;render();}
function go(p){page=p;render();}
function exportCSV(){const rows=curRows&&curRows.length?curRows:[];if(!rows.length){alert('暂无数据可导出');return;}const esc=v=>{let s=v==null?'':String(v);if(s.includes(',')||s.includes('"')||s.includes('\n')){s='"'+s.replace(/"/g,'""')+'"';}return s;};let csv='\ufeff'+COLS.map(esc).join(',');rows.forEach(r=>{csv+='\n'+COLS.map(h=>esc(r[h])).join(',');});const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);const d=new Date();const st=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');a.download='rider_export_'+st+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},200);}
function setSize(){pageSize=parseInt(document.getElementById('fPageSize').value)||15;page=1;render();}
function viewAgreement(idx){const p=curRows[idx];if(!p||!p['解除协议']||p['解除协议'].indexOf('http')!==0)return;document.getElementById('modalImg').src=p['解除协议'];document.getElementById('modalInfo').textContent=p['骑手姓名']+' · '+p['市/区县']+' · '+p['站点'];document.getElementById('modal').classList.add('show');}
function closeModal(e){if(e&&e.target!==document.getElementById('modal'))return;document.getElementById('modal').classList.remove('show');document.getElementById('modalImg').src='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.getElementById('search').addEventListener('input',function(){page=1;render();});
document.getElementById('fRegion').addEventListener('change',function(){document.getElementById('fCity').value='';document.getElementById('fStation').value='';updateFilters();page=1;render();});
document.getElementById('fCity').addEventListener('change',function(){autoFillRegion(this.value);document.getElementById('fStation').value='';updateFilters();page=1;render();});
document.getElementById('fStation').addEventListener('change',function(){autoFillCityRegion(this.value);updateFilters();page=1;render();});
document.getElementById('fReason').addEventListener('change',function(){page=1;render();});
['fSubmitStart','fSubmitEnd','fEndStart','fEndEnd'].forEach(id=>document.getElementById(id).addEventListener('change',function(){page=1;render();}));
document.getElementById('fPageSize').addEventListener('change',setSize);
document.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.key;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}page=1;render();}));
function setDefaultDates(){var e=new Date();e.setDate(e.getDate()-1);var y=new Date(e);y.setMonth(y.getMonth()-2);function f(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}var s=f(y),t=f(e);['fSubmitStart','fEndStart'].forEach(id=>document.getElementById(id).value=s);['fSubmitEnd','fEndEnd'].forEach(id=>document.getElementById(id).value=t);}
function reset(){['search','fReason'].forEach(id=>document.getElementById(id).value='');document.getElementById('fRegion').value='';document.getElementById('fCity').value='';document.getElementById('fStation').value='';setDefaultDates();document.getElementById('fPageSize').value='15';pageSize=15;page=1;updateFilters();render();}
function init(){setDefaultDates();updateFilters();cards(DATA);renderReasons(DATA);renderCharts(DATA);page=1;pageSize=15;render();}
init();
</script></body></html>
