/* ====== mt-style-injected ====== */
:root{
  --mt-yellow:#FFC300;

  --mt-dark:#1B2233;
  --mt-dark2:#2D3447;

  --mt-th-c:#1B2233;
  --mt-row-alt:#FAFBFC;
  --mt-row-hover:#FFF8E1;
}

body{
  font-family:"MiSans","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif!important;

  font-size:14px!important;
  line-height:1.6!important;
}

/* ---- 页头 ---- */

  background:linear-gradient(135deg,var(--mt-dark) 0%,var(--mt-dark2) 60%,#3A4458 100%)!important;
  color:#fff!important;
  border-radius:var(--mt-radius)!important;
  padding:20px 26px!important;
  margin-bottom:14px!important;
  position:relative!important;
}
.header::after,.u-header::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--mt-yellow) 0%,var(--mt-yellow-d) 50%,var(--mt-yellow) 100%);
}
.header h1,.u-header h1,.u-header .doctitle{
  color:#fff!important;font-size:21px!important;font-weight:700!important;letter-spacing:.3px;
}

  color:#C6CAD6!important;font-size:12px!important;margin-top:4px!important;
}

/* ---- wrap / container ---- */
.container{max-width:100%!important;margin:0!important}
.wrap{max-width:1440px!important;margin:0 auto!important}

.doctime,.sub{color:var(--mt-text2)!important;font-size:12px!important}

/* ---- Tab ---- */

/* ---- 标签 tag ---- */
.tag{

<style id="unified-theme-v1">
/* =====================================================================
   unified-theme v1 — 全站通用主题（唯一主题源，所有看板统一调用）
   基准：考核看板（delivery-assessment-dashboard-oct.html）设计语言
   管理：改这一处 → 所有页面生效
   结构：
     [1] 设计令牌（--tk-* 统一命名 + 遗留 token 名映射）
     [2] 顶部导航统一层（sticky 通栏/右侧成组/窄屏紧凑）
     [3] 页面对齐层（body.theme-align 时生效，考核看板天然对齐不受影响）

/* ---------- [1] 设计令牌 ---------- */
:root{
  /* 核心色板 */
  --tk-navy:#1B2233; --tk-navy2:#2D3447; --tk-navy3:#3A4458;
  --tk-gold:#FFC300; --tk-gold-d:#F5A623;
  --tk-bg:#F0F2F5; --tk-card:#FFFFFF; --tk-line:#EAECEF; --tk-line-2:#e6eaf1;
  --tk-ink:#1B1B33; --tk-muted:#6B7280; --tk-muted2:#8A8FA3;
  --tk-good:#188038; --tk-warn:#F5A623; --tk-danger:#d93025; --tk-info:#1967D2;
  /* 字体 / 圆角 / 阴影 / 间距 / 缓动 */
  --tk-font:"MiSans","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --tk-radius-card:12px; --tk-radius-card-s:10px; --tk-radius-ctl:8px; --tk-radius-pill:999px;
  --tk-shadow-card:0 2px 10px rgba(27,34,51,.07);
  --tk-shadow-card-h:0 2px 4px rgba(16,24,40,.06),0 10px 28px rgba(16,24,40,.10);
  --tk-shadow-lift:0 6px 18px rgba(27,34,51,.10);
  --tk-ease:cubic-bezier(.22,.61,.36,1);
  --tk-sp-2:8px; --tk-sp-3:12px; --tk-sp-4:16px;

  /* 遗留 token 名统一映射（!important：页面内同名定义不再各自为政） */
  --mt-bg:#F0F2F5!important; --mt-card:#FFFFFF!important; --mt-border:#EAECEF!important;
  --mt-dark:#1B2233!important; --mt-dark2:#2D3447!important; --mt-radius:8px!important;
  --mt-shadow:0 1px 4px rgba(27,34,51,.06)!important; --mt-shadow-h:0 4px 14px rgba(27,34,51,.1)!important;
  --mt-text:#1B1B33!important; --mt-text2:#6B7280!important; --mt-text3:#7D8290!important;
  --mt-yellow:#FFC300!important; --mt-yellow-d:#F5A623!important;
  --mt-th-bg:#F8F9FA!important; --mt-th-c:#1B2233!important;
  --mt-row-alt:#FAFBFC!important; --mt-row-hover:#FFF8E1!important;
  --bg:#F0F2F5!important; --border:#EAECEF!important;
  --dark:#1B2233!important; --dark2:#2D3447!important;
  --yellow:#FFC300!important; --yellow-d:#F5A623!important;
  --text:#1B1B33!important; --text2:#6B7280!important; --text3:#8A8FA3!important;
  --card:#FFFFFF!important; --green:#52C41A!important; --orange:#FA8C16!important; --radius:12px!important;
}

/* ---------- [2] 顶部导航统一层 ---------- */
.top-nav{position:sticky;top:0;z-index:9000;display:flex;align-items:center;gap:12px;padding:0 20px!important;height:40px!important;margin:0!important;background:linear-gradient(90deg,#1B2233 0%,#2D3447 100%)!important;color:#e2e8f0;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.2);white-space:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-radius:0!important}

.top-nav a:hover{color:#FFC300}
.top-nav .nav-current{color:#fff!important;font-weight:700!important;margin-left:4px;white-space:nowrap}
.top-nav .nav-sep{color:#3A4458;margin:0 2px}
.top-nav .nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.top-nav .nav-right .nav-switch{margin-left:0!important}
.top-nav .nav-switch{margin-left:0!important;border:1px solid rgba(255,255,255,.22)!important;border-radius:999px!important;padding:3px 12px!important;line-height:1.4!important;transition:all .15s!important;font-size:11px}
.top-nav .nav-switch:hover{border-color:rgba(255,195,0,.65)!important;background:rgba(255,195,0,.12)!important}
.top-nav .nav-cities{flex:none;display:flex;align-items:center;gap:6px}
@media(max-width:1180px){.top-nav .bar-status{display:none!important}}
@media(max-width:980px){.top-nav .bar-score{display:none!important}}
@media (max-width:640px){.top-nav{padding:0 12px!important;font-size:12px;gap:8px!important;height:36px!important}.top-nav .nav-switch{padding:2px 9px!important;font-size:11px}}
html.embed .top-nav{display:none}
/* [TK-NAV-WIDTH] 导航与看板同宽：内容区以 .wrap 限宽 1440 居中的页面（骑手主看板/概览/协议），顶导航同步限宽居中，宽屏不再"导航通栏、看板居中"错位 */
@media(min-width:1500px){.top-nav{padding-left:max(20px,calc((100% - 1440px)/2))!important;padding-right:max(20px,calc((100% - 1440px)/2))!important}}
/* [TK-NAV-FIT] 导航防溢出：分级紧凑（间距/按钮/城市胶囊逐级收紧），窄屏下切换按钮不再被横向滚动藏住 */
@media(max-width:1500px){
  .top-nav{gap:8px!important}
  .top-nav .nav-switch{padding:2px 9px!important;font-size:10.5px!important}
  .top-nav .nav-cities{gap:4px!important}

}
@media(max-width:1180px){
  .top-nav .bar-score{display:none!important}
}
@media(max-width:980px){

}
@media(max-width:700px){
  .top-nav{gap:4px!important;padding:0 6px!important}
  .top-nav .nav-sep{display:none!important}
  .top-nav .nav-switch{padding:2px 6px!important;font-size:10px!important}
  .top-nav .nav-cities{gap:3px!important}
  .top-nav .nav-cities .city-tab{padding:3px 5px!important}
}

/* ---------- [3] 页面对齐层（body.theme-align 时生效） ---------- */
body.theme-align{font-family:var(--tk-font)!important;background:radial-gradient(1200px 420px at 12% -6%,rgba(255,195,0,.08),transparent 60%),radial-gradient(1000px 460px at 92% -10%,rgba(59,111,245,.07),transparent 55%),var(--tk-bg)!important}

@media(max-width:600px){body.theme-align .header h1{font-size:18px!important}}
body.theme-align .card{border-radius:var(--tk-radius-card)!important;box-shadow:var(--tk-shadow-card)!important;transition:box-shadow .2s var(--tk-ease)}

body.theme-align th a,body.theme-align th span{color:#fff!important}

</style>

function updateFilters(){const fr=document.getElementById('fRegion').value;const fc=document.getElementById('fCity').value;const fst=document.getElementById('fStation').value;const fs=document.getElementById('fReason').value;let rd=DATA;if(fr)rd=rd.filter(r=>r['区域']===fr);const cities=[...new Set(rd.map(r=>r['市/区县']).filter(Boolean))].sort();const cs=document.getElementById('fCity');const keepCity=cities.includes(fc);cs.innerHTML='<option value="">全部市/区县</option>'+cities.map(c=>'<option value="'+c+'"'+(c===fc?' selected':'')+'>'+c+'</option>').join('');if(!keepCity)cs.value='';let cd=rd;const nc=cs.value;if(nc)cd=cd.filter(r=>r['市/区县']===nc);const stations=[...new Set(cd.map(r=>r['站点']).filter(Boolean))].sort();const ss=document.getElementById('fStation');const keepStation=stations.includes(fst);ss.innerHTML='<option value="">全部站点</option>'+stations.map(s=>'<option value="'+s+'"'+(s===fst?' selected':'')+'>'+s+'</option>').join('');if(!keepStation)ss.value='';let sd=cd;const nst=ss.value;if(nst)sd=sd.filter(r=>r['站点']===nst);const reasons=[...new Set(sd.map(r=>r['解除合作原因']).filter(Boolean))].sort();const rs=document.getElementById('fReason');const keepReason=reasons.includes(fs);rs.innerHTML='<option value="">全部解除原因</option>'+reasons.map(r=>'<option value="'+r+'"'+(r===fs?' selected':'')+'>'+r+'</option>').join('');if(!keepReason)rs.value='';}

function render(){const q=document.getElementById('search').value.trim().toLowerCase();const fr=document.getElementById('fRegion').value,fc=document.getElementById('fCity').value,fst=document.getElementById('fStation').value,fs=document.getElementById('fReason').value;const fa=document.getElementById('fHasAgree').value;let l=DATA.filter(r=>{if(fr&&r['区域']!==fr)return false;if(fc&&r['市/区县']!==fc)return false;if(fst&&r['站点']!==fst)return false;if(fs&&r['解除合作原因']!==fs)return false;if(fa==='yes'&&!/^https?:/i.test((r['解除协议']||'').trim()))return false;if(fa==='no'&&/^https?:/i.test((r['解除协议']||'').trim()))return false;if(q){const hay=Object.values(r).join(' ').toLowerCase();if(hay.indexOf(q)<0)return false;}return true;});if(sortKey)l=[...l].sort((a,b)=>{if(sortKey==='提交时间'||sortKey==='入职时间'||sortKey==='预计解除合作时间'){return(toTs(a[sortKey])-toTs(b[sortKey]))*sortDir}return String(a[sortKey]).localeCompare(String(b[sortKey]),'zh',{numeric:true})*sortDir});curRows=l;cards(l);const ttl=l.length,tp=Math.max(1,Math.ceil(ttl/pageSize));if(page>tp)page=tp;if(page<1)page=1;const st=(page-1)*pageSize,sl=l.slice(st,st+pageSize);const tb=document.getElementById('tbody');tb.innerHTML=sl.length?sl.map(function(p){const hasAgree=/^https?:/i.test((p['解除协议']||'').trim());const agreeHtml=hasAgree?'<a class="btn-view has" onclick="viewAgreement(\''+encodeURIComponent(p['解除协议'])+'\',\''+p['骑手姓名']+'\',\''+p['市/区县']+'\',\''+p['站点']+'\')">查看</a>':'<span class="btn-view no">无</span>';return '<tr><td><span class="tag '+(p['区域']==='华东'?'hd':'hs')+'">'+p['区域']+'</span></td><td>'+p['提交时间']+'</td><td><b>'+p['市/区县']+'</b></td><td>'+p['站点']+'</td><td>'+p['骑手姓名']+'</td><td>'+maskId(p['骑手ID'])+'</td><td>'+p['解除合作原因']+'</td><td>'+p['解除合作去向']+'</td><td>'+agreeHtml+'</td></tr>';}).join(''):'<tr><td colspan="9" class="empty">无匹配记录</td></tr>';document.getElementById('meta').textContent='第 '+page+'/'+tp+' 页 · 显示 '+sl.length+' 条 · 共 '+ttl+' 条'+(q?' · 搜索"'+q+'"':'');let h='<button class="pbtn" '+(page<=1?'disabled':'')+' onclick="go(1)">\u00ab</button><button class="pbtn" '+(page<=1?'disabled':'')+' onclick="go('+(page-1)+')">\u2039上一页</button>';for(let i=Math.max(1,page-2);i<=Math.min(tp,page+2);i++){h+='<button class="pbtn '+(i===page?'cur':'')+'" onclick="go('+i+')">'+i+'</button>';}h+='<button class="pbtn" '+(page>=tp?'disabled':'')+' onclick="go('+(page+1)+')">下一页\u203a</button><button class="pbtn" '+(page>=tp?'disabled':'')+' onclick="go('+tp+')">\u00bb</button><span class="pinfo">共 '+ttl+' 条 · '+page+'/'+tp+'</span>';document.getElementById('pager').innerHTML=h;updateSortHeaders();}

/* ---- 协议图链接到期预警：问卷星签名 URL 含 Expires，临近到期（90 天内）或已过期时在页脚亮提示 ---- */
(function(){
  try{
    var exps=DATA.map(function(r){var m=/(?:\?|&)Expires=(\d+)/.exec(r['解除协议']||'');return m?+m[1]:0}).filter(Boolean);
    if(!exps.length)return;
    var min=new Date(Math.min.apply(null,exps)*1000),now=new Date();
    var d=Math.ceil((min-now)/86400000);
    var txt='⚠️ 协议原图为问卷星签名链接，预计 '+min.getFullYear()+'-'+String(min.getMonth()+1).padStart(2,'0')+'-'+String(min.getDate()).padStart(2,'0')+' 前后到期';
    if(d<0){document.getElementById('foot').innerHTML='<span style="color:#F5222D;font-weight:600">'+txt+'，已过期——请数据侧尽快转存为持久地址</span>';}
    else if(d<90){document.getElementById('foot').innerHTML='<span style="color:#D46B08;font-weight:600">'+txt+'（剩 '+d+' 天）——请数据侧提前转存为持久地址</span>';}
    else{document.getElementById('foot').innerHTML+=' · <span style="color:#8A8FA3">'+txt+'</span>';}
  }catch(e){}
})();
/* ---- 快照口径说明：本页数据与主看板独立，避免误解 ---- */
(function(){
  try{
    var sub=document.querySelector('.header .sub');
    if(sub)sub.innerHTML+=' · <span style="color:#C6CAD6">本页为独立快照数据，可能与主看板总数不一致，以主看板为准</span>';
  }catch(e){}
})();
