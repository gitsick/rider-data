<style>
/* ====== unified-style-injected ====== */
:root{
  --u-primary:#409eff;
  --u-dark:#1e293b;
  --u-dark2:#334155;
  --u-bg:#f0f2f5;
  --u-card-bg:#fff;
  --u-card-radius:12px;
  --u-card-shadow:0 2px 10px rgba(30,41,59,.07);
  --u-card-border:1px solid #e8eaed;
  --u-th-bg:#1e293b;
  --u-th-color:#fff;
  --u-text:#333;
  --u-text2:#6b7a8c;
  --u-tag-blue:#ecf5ff;
  --u-tag-blue-c:#409eff;
  --u-tag-green:#f0f9eb;
  --u-tag-green-c:#67c23a;
  --u-tag-amber:#fdf6ec;
  --u-tag-amber-c:#e6a23c;
}
body{font-family:'Microsoft YaHei',system-ui,-apple-system,sans-serif!important;background:#f0f2f5!important;color:#333!important}
.card,.section,.filters,.tblwrap{background:#fff!important;border-radius:12px!important;box-shadow:0 2px 10px rgba(30,41,59,.07)!important;border:1px solid #e8eaed!important}
.card::before,.section h2{border-color:var(--u-primary)!important}
/* 统一表头样式: 深色背景白字 */
th,.dt th{background:linear-gradient(135deg,#1e293b,#334155)!important;color:#fff!important}
th{color:#fff!important}
td{border-color:#e8eaed!important}
tr:hover td{background:#f0f7ff!important}
/* 统一按钮 */
.pbtn,.clearbtn,.city-tab{border-radius:8px!important;border:1px solid #dfe6ee!important;background:#fff!important;color:#5a6b7d!important;transition:all .15s!important}
.pbtn:hover,.clearbtn:hover{background:#ecf5ff!important;border-color:#409eff!important;color:#409eff!important}
.pbtn.cur{background:#409eff!important;color:#fff!important;border-color:#409eff!important;font-weight:600!important}
/* 统一标签 */
.tag{background:#ecf5ff!important;color:#409eff!important}
.tag.hd{background:#f0f9eb!important;color:#67c23a!important}
.tag.hs{background:#fdf6ec!important;color:#e6a23c!important}
/* 统一页头 - 为没有深色页头的页面注入 */
.u-header{background:linear-gradient(135deg,#1e293b 0%,#334155 100%)!important;color:#fff!important;border-radius:12px!important;padding:24px 32px!important;margin-bottom:16px!important}
.u-header h1,.u-header .doctitle{color:#fff!important;font-size:22px!important;font-weight:700!important}
.u-header .sub,.u-header .doctime,.u-header .subtitle{color:#94a3b8!important;font-size:13px!important}
/* 卡片标题统一 */
.card-title{color:#1e293b!important;border-bottom:2px solid #f0f2f5!important}
/* metric 统一 */
.metric .m-num,.card .num{color:#409eff!important}
.metric.hd .m-num,.card.hd .num{color:#67c23a!important}
.metric.hs .m-num,.card.hs .num{color:#e6a23c!important}
.metric{background:#f8fafc!important;border-radius:10px!important}
/* 选中态 */
.tab.cur{color:#409eff!important;border-bottom-color:#409eff!important;background:#f8fbff!important}
.city-tab.active{background:rgba(255,255,255,0.95)!important;color:#1e293b!important}
/* delivery-assessment 的 .dt 表格也统一 */
.dt tr:nth-child(even) td{background:#fafbfc!important}
.dt td{border:1px solid #e8eaed!important}
/* 页脚 */
.foot,.footer{color:#94a3b8!important}
/* ====== end unified-style ====== </style>
<style>
/* ====== mt-style-injected ====== */
:root{
  --mt-yellow:#FFC300;
  --mt-yellow-d:#F5A623;
  --mt-dark:#1B2233;
  --mt-dark2:#2D3447;
  --mt-bg:#F5F6F7;
  --mt-text:#1B1B33;
  --mt-text2:#8A8FA3;
  --mt-text3:#B0B4C0;
  --mt-border:#E8E9EB;
  --mt-card:#FFFFFF;
  --mt-radius:8px;
  --mt-shadow:0 1px 4px rgba(0,0,0,.06);
  --mt-shadow-h:0 4px 16px rgba(0,0,0,.10);
  --mt-th-bg:#F0F1F2;
  --mt-th-c:#1B1B33;
  --mt-row-alt:#FAFBFC;
  --mt-row-hover:#FFF8E1;
}

/* ---- 全局 ---- */
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif!important;
  background:var(--mt-bg)!important;
  color:var(--mt-text)!important;
  font-size:14px!important;
  line-height:1.6!important;
}

/* ---- 页头 ---- */
.header,.u-header{
  background:linear-gradient(135deg,var(--mt-dark) 0%,var(--mt-dark2) 100%)!important;
  color:#fff!important;
  border-radius:var(--mt-radius)!important;
  padding:20px 28px!important;
  margin-bottom:16px!important;
  position:relative!important;
  overflow:hidden!important;
}
.header::after,.u-header::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--mt-yellow),var(--mt-yellow-d));
}
.header h1,.u-header h1,.u-header .doctitle{
  color:#fff!important;font-size:20px!important;font-weight:700!important;letter-spacing:.5px;
}
.header .subtitle,.header .sub,.u-header .sub,.u-header .doctime,.u-header .subtitle{
  color:var(--mt-text3)!important;font-size:12px!important;margin-top:4px!important;
}

/* ---- wrap / container ---- */
.wrap{max-width:1440px!important;margin:0 auto!important}

/* ---- 标题 (非页头内) ---- */
h1{font-size:20px!important;font-weight:700!important;color:var(--mt-text)!important}
.doctitle{font-size:20px!important;font-weight:700!important;color:var(--mt-text)!important}
.doctime,.sub{color:var(--mt-text2)!important;font-size:12px!important}

/* ---- 卡片 ---- */
.card,.section,.filters,.tblwrap,.card-header{
  background:var(--mt-card)!important;
  border-radius:var(--mt-radius)!important;
  box-shadow:var(--mt-shadow)!important;
  border:1px solid var(--mt-border)!important;
}
.card,.section{padding:16px 20px!important;margin-bottom:14px!important}
.card::before{display:none!important}
/* 卡片标题 */
.card-title{
  color:var(--mt-text)!important;
  font-size:15px!important;font-weight:600!important;
  border-bottom:1px solid var(--mt-border)!important;
  padding-bottom:10px!important;margin-bottom:12px!important;
}
.card-title::before{
  content:"";display:inline-block;width:3px;height:14px;
  background:var(--mt-yellow);border-radius:2px;margin-right:8px;
  vertical-align:-2px;
}
.section h2{
  font-size:15px!important;font-weight:600!important;color:var(--mt-text)!important;
  border-left:3px solid var(--mt-yellow)!important;
  padding-left:10px!important;margin-bottom:12px!important;
}

/* ---- KPI / 统计卡片 ---- */
.card .num,.metric .m-num{
  color:var(--mt-dark)!important;font-size:28px!important;font-weight:800!important;
}
.card.hd .num,.metric.hd .m-num{color:#52C41A!important}
.card.hs .num,.metric.hs .m-num{color:#FA8C16!important}
.card .lbl,.metric .m-lbl,.metric .lbl{
  color:var(--mt-text2)!important;font-size:12px!important;margin-top:4px!important;
}
.metric{background:var(--mt-row-alt)!important;border-radius:6px!important;padding:12px!important}

/* ---- 表格 ---- */
table{width:100%!important;border-collapse:collapse!important;font-size:13px!important}
th,.dt th{
  background:var(--mt-th-bg)!important;
  color:var(--mt-th-c)!important;
  font-weight:600!important;font-size:12px!important;
  padding:10px 12px!important;
  border-bottom:1px solid var(--mt-border)!important;
  text-align:left!important;
}
th{background:var(--mt-th-bg)!important;color:var(--mt-th-c)!important}
td,.dt td{
  padding:8px 12px!important;
  border-bottom:1px solid var(--mt-border)!important;
  color:var(--mt-text)!important;font-size:13px!important;
}
.dt td{border:1px solid var(--mt-border)!important;text-align:center!important}
tr:nth-child(even) td,.dt tr:nth-child(even) td{background:var(--mt-row-alt)!important}
tr:hover td,.dt tr:hover td{background:var(--mt-row-hover)!important}
.dt .city-cell{font-weight:700!important;text-align:left!important;padding-left:10px!important}

/* ---- 按钮 ---- */
.pbtn,.clearbtn,.city-tab,.toolbar select,.filters select,.filters input{
  border-radius:6px!important;
  border:1px solid var(--mt-border)!important;
  background:var(--mt-card)!important;
  color:var(--mt-text2)!important;
  font-size:13px!important;
  padding:7px 14px!important;
  transition:all .15s!important;
  outline:none!important;
}
.filters input{min-width:200px!important}
.pbtn:hover,.clearbtn:hover{
  border-color:var(--mt-yellow)!important;
  color:var(--mt-dark)!important;
  background:var(--mt-row-hover)!important;
}
.pbtn.cur{
  background:var(--mt-yellow)!important;
  color:var(--mt-dark)!important;
  border-color:var(--mt-yellow)!important;
  font-weight:700!important;
}
.pbtn:disabled{opacity:.4!important;cursor:not-allowed!important}

/* ---- Tab ---- */
.tab{
  padding:10px 20px!important;font-size:14px!important;
  color:var(--mt-text2)!important;
  border-bottom:2px solid transparent!important;
  transition:all .15s!important;
}
.tab.cur{
  color:var(--mt-dark)!important;
  border-bottom-color:var(--mt-yellow)!important;
  font-weight:600!important;
  background:transparent!important;
}
.tab:hover{color:var(--mt-dark)!important}

/* ---- 城市标签 (delivery-assessment) ---- */
.city-tab{
  background:rgba(255,255,255,.12)!important;
  color:#fff!important;
  border:2px solid transparent!important;
  cursor:pointer!important;
}
.city-tab:hover{background:rgba(255,255,255,.22)!important}
.city-tab.active{
  background:var(--mt-yellow)!important;
  color:var(--mt-dark)!important;
  border-color:var(--mt-yellow)!important;
  font-weight:700!important;
}

/* ---- 标签 tag ---- */
.tag{
  display:inline-block!important;
  padding:2px 10px!important;
  border-radius:4px!important;
  font-size:12px!important;font-weight:600!important;
  background:#FFF3D4!important;color:#B8860B!important;
}
.tag.hd{background:#E6F7DD!important;color:#389E0D!important}
.tag.hs{background:#FFF1E0!important;color:#D46B08!important}

/* ---- 分页 ---- */
.pager{display:flex!important;align-items:center!important;justify-content:center!important;
  gap:6px!important;padding:14px 0 8px!important;flex-wrap:wrap!important}
.pinfo{font-size:12px!important;color:var(--mt-text2)!important;margin:0 6px!important}

/* ---- 页脚 ---- */
.foot,.footer{
  text-align:center!important;
  color:var(--mt-text3)!important;
  font-size:12px!important;
  padding:20px 0!important;
}

/* ---- 杂项 ---- */
.meta{color:var(--mt-text2)!important;font-size:12px!important}
.rb{border-bottom:1px dashed var(--mt-border)!important}
.rv{color:var(--mt-dark)!important;font-weight:600!important}
.notes{color:var(--mt-text)!important;line-height:1.9!important}
.notes li{margin-left:18px!important}
.empty{color:var(--mt-text3)!important}
/* 导航按钮适配 */
.pn{
  background:var(--mt-dark)!important;
  border:1px solid rgba(255,195,0,.3)!important;
}
.pn:hover{background:var(--mt-dark2)!important;border-color:var(--mt-yellow)!important}
/* ====== end mt-style ====== </style>

/* ---- 标题 (非页头内) ---- */
h1{font-size:20px!important;font-weight:700!important;color:var(--mt-text)!important}
.doctitle{font-size:20px!important;font-weight:700!important;color:var(--mt-text)!important}
.doctime,.sub{color:var(--mt-text2)!important;font-size:12px!important}

/* ---- 卡片 ---- */
.card,.section,.filters,.tblwrap,.card-header{
  background:var(--mt-card)!important;
  border-radius:var(--mt-radius)!important;
  box-shadow:var(--mt-shadow)!important;
  border:1px solid var(--mt-border)!important;
}
.card,.section{padding:16px 20px!important;margin-bottom:14px!important}
.card::before{display:none!important}
/* 卡片标题 */
.card-title{
  color:var(--mt-text)!important;
  font-size:15px!important;font-weight:600!important;
  border-bottom:1px solid var(--mt-border)!important;
  padding-bottom:10px!important;margin-bottom:12px!important;
}
.card-title::before{
  content:"";display:inline-block;width:3px;height:14px;
  background:var(--mt-yellow);border-radius:2px;margin-right:8px;
  vertical-align:-2px;
}
.section h2{
  font-size:15px!important;font-weight:600!important;color:var(--mt-text)!important;
  border-left:3px solid var(--mt-yellow)!important;
  padding-left:10px!important;margin-bottom:12px!important;
}

/* ---- KPI / 统计卡片 ---- */
.card .num,.metric .m-num{
  color:var(--mt-dark)!important;font-size:28px!important;font-weight:800!important;
}
.card.hd .num,.metric.hd .m-num{color:#52C41A!important}
.card.hs .num,.metric.hs .m-num{color:#FA8C16!important}
.card .lbl,.metric .m-lbl,.metric .lbl{
  color:var(--mt-text2)!important;font-size:12px!important;margin-top:4px!important;
}
.metric{background:var(--mt-row-alt)!important;border-radius:6px!important;padding:12px!important}

/* ---- 表格 ---- */
table{width:100%!important;border-collapse:collapse!important;font-size:13px!important}
th,.dt th{
  background:var(--mt-th-bg)!important;
  color:var(--mt-th-c)!important;
  font-weight:600!important;font-size:12px!important;
  padding:10px 12px!important;
  border-bottom:1px solid var(--mt-border)!important;
  text-align:left!important;
}
th{background:var(--mt-th-bg)!important;color:var(--mt-th-c)!important}
td,.dt td{
  padding:8px 12px!important;
  border-bottom:1px solid var(--mt-border)!important;
  color:var(--mt-text)!important;font-size:13px!important;
}
.dt td{border:1px solid var(--mt-border)!important;text-align:center!important}
tr:nth-child(even) td,.dt tr:nth-child(even) td{background:var(--mt-row-alt)!important}
tr:hover td,.dt tr:hover td{background:var(--mt-row-hover)!important}
.dt .city-cell{font-weight:700!important;text-align:left!important;padding-left:10px!important}

/* ---- 按钮 ---- */
.pbtn,.clearbtn,.city-tab,.toolbar select,.filters select,.filters input{
  border-radius:6px!important;
  border:1px solid var(--mt-border)!important;
  background:var(--mt-card)!important;
  color:var(--mt-text2)!important;
  font-size:13px!important;
  padding:7px 14px!important;
  transition:all .15s!important;
  outline:none!important;
}
.filters input{min-width:200px!important}
.pbtn:hover,.clearbtn:hover{
  border-color:var(--mt-yellow)!important;
  color:var(--mt-dark)!important;
  background:var(--mt-row-hover)!important;
}
.pbtn.cur{
  background:var(--mt-yellow)!important;
  color:var(--mt-dark)!important;
  border-color:var(--mt-yellow)!important;
  font-weight:700!important;
}
.pbtn:disabled{opacity:.4!important;cursor:not-allowed!important}

/* ---- Tab ---- */
.tab{
  padding:10px 20px!important;font-size:14px!important;
  color:var(--mt-text2)!important;
  border-bottom:2px solid transparent!important;
  transition:all .15s!important;
}
.tab.cur{
  color:var(--mt-dark)!important;
  border-bottom-color:var(--mt-yellow)!important;
  font-weight:600!important;
  background:transparent!important;
}
.tab:hover{color:var(--mt-dark)!important}

/* ---- 城市标签 (delivery-assessment) ---- */
.city-tab{
  background:rgba(255,255,255,.12)!important;
  color:#fff!important;
  border:2px solid transparent!important;
  cursor:pointer!important;
}
.city-tab:hover{background:rgba(255,255,255,.22)!important}
.city-tab.active{
  background:var(--mt-yellow)!important;
  color:var(--mt-dark)!important;
  border-color:var(--mt-yellow)!important;
  font-weight:700!important;
}

/* ---- 标签 tag ---- */
.tag{
  display:inline-block!important;
  padding:2px 10px!important;
  border-radius:4px!important;
  font-size:12px!important;font-weight:600!important;
  background:#FFF3D4!important;color:#B8860B!important;
}
.tag.hd{background:#E6F7DD!important;color:#389E0D!important}
.tag.hs{background:#FFF1E0!important;color:#D46B08!important}

/* ---- 分页 ---- */
.pager{display:flex!important;align-items:center!important;justify-content:center!important;
  gap:6px!important;padding:14px 0 8px!important;flex-wrap:wrap!important}
.pinfo{font-size:12px!important;color:var(--mt-text2)!important;margin:0 6px!important}

/* ---- 页脚 ---- */
.foot,.footer{
  text-align:center!important;
  color:var(--mt-text3)!important;
  font-size:12px!important;
  padding:20px 0!important;
}

/* ---- 杂项 ---- */
.meta{color:var(--mt-text2)!important;font-size:12px!important}
.rb{border-bottom:1px dashed var(--mt-border)!important}
.rv{color:var(--mt-dark)!important;font-weight:600!important}
.notes{color:var(--mt-text)!important;line-height:1.9!important}
.notes li{margin-left:18px!important}
.empty{color:var(--mt-text3)!important}
/* 导航按钮适配 */
.pn{
  background:var(--mt-dark)!important;
  border:1px solid rgba(255,195,0,.3)!important;
}
.pn:hover{background:var(--mt-dark2)!important;border-color:var(--mt-yellow)!important}

  background:var(--mt-bg)!important;
  color:var(--mt-text)!important;
  font-size:14px!important;
  line-height:1.6!important;
}

/* ---- 页头 ---- */
.header,.u-header{
  background:linear-gradient(135deg,var(--mt-dark) 0%,var(--mt-dark2) 100%)!important;
  color:#fff!important;
  border-radius:var(--mt-radius)!important;
  padding:20px 28px!important;
  margin-bottom:16px!important;
  position:relative!important;
  overflow:hidden!important;
}
.header::after,.u-header::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--mt-yellow),var(--mt-yellow-d));
}
.header h1,.u-header h1,.u-header .doctitle{
  color:#fff!important;font-size:20px!important;font-weight:700!important;letter-spacing:.5px;
}
.header .subtitle,.header .sub,.u-header .sub,.u-header .doctime,.u-header .subtitle{
  color:var(--mt-text3)!important;font-size:12px!important;margin-top:4px!important;
}

/* ---- wrap / container ---- */
.wrap{max-width:1440px!important;margin:0 auto!important}

/* ---- 标题 (非页头内) ---- */
h1{font-size:20px!important;font-weight:700!important;color:var(--mt-text)!important}
.doctitle{font-size:20px!important;font-weight:700!important;color:var(--mt-text)!important}
.doctime,.sub{color:var(--mt-text2)!important;font-size:12px!important}

/* ---- 卡片 ---- */
.card,.section,.filters,.tblwrap,.card-header{
  background:var(--mt-card)!important;
  border-radius:var(--mt-radius)!important;
  box-shadow:var(--mt-shadow)!important;
  border:1px solid var(--mt-border)!important;
}
.card,.section{padding:16px 20px!important;margin-bottom:14px!important}
.card::before{display:none!important}
/* 卡片标题 */
.card-title{
  color:var(--mt-text)!important;
  font-size:15px!important;font-weight:600!important;
  border-bottom:1px solid var(--mt-border)!important;
  padding-bottom:10px!important;margin-bottom:12px!important;
}
.card-title::before{
  content:"";display:inline-block;width:3px;height:14px;
  background:var(--mt-yellow);border-radius:2px;margin-right:8px;
  vertical-align:-2px;
}
.section h2{
  font-size:15px!important;font-weight:600!important;color:var(--mt-text)!important;
  border-left:3px solid var(--mt-yellow)!important;
  padding-left:10px!important;margin-bottom:12px!important;
}

/* ---- KPI / 统计卡片 ---- */
.card .num,.metric .m-num{
  color:var(--mt-dark)!important;font-size:28px!important;font-weight:800!important;
}
.card.hd .num,.metric.hd .m-num{color:#52C41A!important}
.card.hs .num,.metric.hs .m-num{color:#FA8C16!important}
.card .lbl,.metric .m-lbl,.metric .lbl{
  color:var(--mt-text2)!important;font-size:12px!important;margin-top:4px!important;
}
.metric{background:var(--mt-row-alt)!important;border-radius:6px!important;padding:12px!important}

/* ---- 表格 ---- */
table{width:100%!important;border-collapse:collapse!important;font-size:13px!important}
th,.dt th{
  background:var(--mt-th-bg)!important;
  color:var(--mt-th-c)!important;
  font-weight:600!important;font-size:12px!important;
  padding:10px 12px!important;
  border-bottom:1px solid var(--mt-border)!important;
  text-align:left!important;
}
th{background:var(--mt-th-bg)!important;color:var(--mt-th-c)!important}
td,.dt td{
  padding:8px 12px!important;
  border-bottom:1px solid var(--mt-border)!important;
  color:var(--mt-text)!important;font-size:13px!important;
}
.dt td{border:1px solid var(--mt-border)!important;text-align:center!important}
tr:nth-child(even) td,.dt tr:nth-child(even) td{background:var(--mt-row-alt)!important}
tr:hover td,.dt tr:hover td{background:var(--mt-row-hover)!important}
.dt .city-cell{font-weight:700!important;text-align:left!important;padding-left:10px!important}

/* ---- 按钮 ---- */
.pbtn,.clearbtn,.city-tab,.toolbar select,.filters select,.filters input{
  border-radius:6px!important;
  border:1px solid var(--mt-border)!important;
  background:var(--mt-card)!important;
  color:var(--mt-text2)!important;
  font-size:13px!important;
  padding:7px 14px!important;
  transition:all .15s!important;
  outline:none!important;
}
.filters input{min-width:200px!important}
.pbtn:hover,.clearbtn:hover{
  border-color:var(--mt-yellow)!important;
  color:var(--mt-dark)!important;
  background:var(--mt-row-hover)!important;
}
.pbtn.cur{
  background:var(--mt-yellow)!important;
  color:var(--mt-dark)!important;
  border-color:var(--mt-yellow)!important;
  font-weight:700!important;
}
.pbtn:disabled{opacity:.4!important;cursor:not-allowed!important}

/* ---- Tab ---- */
.tab{
  padding:10px 20px!important;font-size:14px!important;
  color:var(--mt-text2)!important;
  border-bottom:2px solid transparent!important;
  transition:all .15s!important;
}
.tab.cur{
  color:var(--mt-dark)!important;
  border-bottom-color:var(--mt-yellow)!important;
  font-weight:600!important;
  background:transparent!important;
}
.tab:hover{color:var(--mt-dark)!important}

/* ---- 城市标签 (delivery-assessment) ---- */
.city-tab{
  background:rgba(255,255,255,.12)!important;
  color:#fff!important;
  border:2px solid transparent!important;
  cursor:pointer!important;
}
.city-tab:hover{background:rgba(255,255,255,.22)!important}
.city-tab.active{
  background:var(--mt-yellow)!important;
  color:var(--mt-dark)!important;
  border-color:var(--mt-yellow)!important;
  font-weight:700!important;
}

/* ---- 标签 tag ---- */
.tag{
  display:inline-block!important;
  padding:2px 10px!important;
  border-radius:4px!important;
  font-size:12px!important;font-weight:600!important;
  background:#FFF3D4!important;color:#B8860B!important;
}
.tag.hd{background:#E6F7DD!important;color:#389E0D!important}
.tag.hs{background:#FFF1E0!important;color:#D46B08!important}

/* ---- 分页 ---- */
.pager{display:flex!important;align-items:center!important;justify-content:center!important;
  gap:6px!important;padding:14px 0 8px!important;flex-wrap:wrap!important}
.pinfo{font-size:12px!important;color:var(--mt-text2)!important;margin:0 6px!important}

/* ---- 页脚 ---- */
.foot,.footer{
  text-align:center!important;
  color:var(--mt-text3)!important;
  font-size:12px!important;
  padding:20px 0!important;
}

/* ---- 杂项 ---- */
.meta{color:var(--mt-text2)!important;font-size:12px!important}
.rb{border-bottom:1px dashed var(--mt-border)!important}
.rv{color:var(--mt-dark)!important;font-weight:600!important}
.notes{color:var(--mt-text)!important;line-height:1.9!important}
.notes li{margin-left:18px!important}
.empty{color:var(--mt-text3)!important}
/* 导航按钮适配 */
.pn{
  background:var(--mt-dark)!important;
  border:1px solid rgba(255,195,0,.3)!important;
}
.pn:hover{background:var(--mt-dark2)!important;border-color:var(--mt-yellow)!important}
