/* ====== mt-style-injected ====== */
:root{
  --mt-yellow:#FFC300;

  --mt-dark:#1B2233;
  --mt-dark2:#2D3447;

  --mt-th-c:#1B2233;
  --mt-row-alt:#FAFBFC;
  --mt-row-hover:#FFF8E1;
}

body{
  font-family:"MiSans","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif!important;

  font-size:14px!important;
  line-height:1.6!important;
}

/* ---- 页头 ---- */

  background:linear-gradient(135deg,var(--mt-dark) 0%,var(--mt-dark2) 60%,#3A4458 100%)!important;
  color:#fff!important;
  border-radius:var(--mt-radius)!important;
  padding:20px 26px!important;
  margin-bottom:14px!important;
  position:relative!important;
}
.header::after,.u-header::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--mt-yellow) 0%,var(--mt-yellow-d) 50%,var(--mt-yellow) 100%);
}
.header h1,.u-header h1,.u-header .doctitle{
  color:#fff!important;font-size:21px!important;font-weight:700!important;letter-spacing:.3px;
}

  color:#C6CAD6!important;font-size:12px!important;margin-top:4px!important;
}

/* ---- wrap / container ---- */
.container{max-width:100%!important;margin:0!important}
.wrap{max-width:1440px!important;margin:0 auto!important}

.doctime,.sub{color:var(--mt-text2)!important;font-size:12px!important}

/* ---- Tab ---- */

/* ---- 标签 tag ---- */
.tag{

var DATA=[];let __agreementLoaded=false;

(function(){

let curRows=[];

function cards(a){const t=a.length,hd=a.filter(r=>r['区域']==='华东').length,hs=t-hd;const wa=a.filter(r=>/^https?:/i.test((r['解除协议']||'').trim())).length;const na=t-wa;const wp=t>0?(wa/t*100).toFixed(1):0;const np=t>0?(na/t*100).toFixed(1):0;document.getElementById('statCards').innerHTML='<div class="card"><div class="num">'+t+'</div><div class="lbl">登记总数</div><div class="pct">'+hd+' 华东 · '+hs+' 华南</div></div><div class="card"><div class="num" style="color:#52C41A">'+wa+'</div><div class="lbl">有协议</div><div class="pct">'+wp+'% of total</div></div><div class="card no"><div class="num">'+na+'</div><div class="lbl">无协议</div><div class="pct">'+np+'% of total</div></div><div class="card hd"><div class="num">'+hd+'</div><div class="lbl">华东</div><div class="pct">'+(t>0?(hd/t*100).toFixed(1):0)+'%</div></div><div class="card hs"><div class="num">'+hs+'</div><div class="lbl">华南</div><div class="pct">'+(t>0?(hs/t*100).toFixed(1):0)+'%</div></div>';}
function fill(sel,key,ph,data){data=data||DATA;const s=document.getElementById(sel);s.innerHTML='<option value="">'+ph+'</option>';[...new Set(data.map(r=>r[key]).filter(Boolean))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});}
function updateFilters(){const fr=document.getElementById('fRegion').value;const fc=document.getElementById('fCity').value;const fst=document.getElementById('fStation').value;const fs=document.getElementById('fReason').value;let rd=DATA;if(fr)rd=rd.filter(r=>r['区域']===fr);const cities=[...new Set(rd.map(r=>r['市/区县']).filter(Boolean))].sort();const cs=document.getElementById('fCity');const keepCity=cities.includes(fc);cs.innerHTML='<option value="">全部市/区县</option>'+cities.map(c=>'<option value="'+c+'"'+(c===fc?' selected':'')+'>'+c+'</option>').join('');if(!keepCity)cs.value='';let cd=rd;const nc=cs.value;if(nc)cd=cd.filter(r=>r['市/区县']===nc);const stations=[...new Set(cd.map(r=>r['站点']).filter(Boolean))].sort();const ss=document.getElementById('fStation');const keepStation=stations.includes(fst);ss.innerHTML='<option value="">全部站点</option>'+stations.map(s=>'<option value="'+s+'"'+(s===fst?' selected':'')+'>'+s+'</option>').join('');if(!keepStation)ss.value='';let sd=cd;const nst=ss.value;if(nst)sd=sd.filter(r=>r['站点']===nst);const reasons=[...new Set(sd.map(r=>r['解除合作原因']).filter(Boolean))].sort();const rs=document.getElementById('fReason');const keepReason=reasons.includes(fs);rs.innerHTML='<option value="">全部解除原因</option>'+reasons.map(r=>'<option value="'+r+'"'+(r===fs?' selected':'')+'>'+r+'</option>').join('');if(!keepReason)rs.value='';}
let sortKey='提交时间',sortDir=-1,page=1,pageSize=15;
function toTs(v){if(!v)return 0;const p=String(v).trim().split(/\s+/);const d=(p[0]||'0/0/0').split('/');const t=p[1]?p[1].split(':').map(Number):[0,0,0];return Date.UTC(+d[0],(+d[1]||1)-1,+d[2]||1,t[0]||0,t[1]||0,t[2]||0)}

function render(){const q=document.getElementById('search').value.trim().toLowerCase();const fr=document.getElementById('fRegion').value,fc=document.getElementById('fCity').value,fst=document.getElementById('fStation').value,fs=document.getElementById('fReason').value;const fa=document.getElementById('fHasAgree').value;let l=DATA.filter(r=>{if(fr&&r['区域']!==fr)return false;if(fc&&r['市/区县']!==fc)return false;if(fst&&r['站点']!==fst)return false;if(fs&&r['解除合作原因']!==fs)return false;if(fa==='yes'&&!/^https?:/i.test((r['解除协议']||'').trim()))return false;if(fa==='no'&&/^https?:/i.test((r['解除协议']||'').trim()))return false;if(q){const hay=Object.values(r).join(' ').toLowerCase();if(hay.indexOf(q)<0)return false;}return true;});if(sortKey)l=[...l].sort((a,b)=>{if(sortKey==='提交时间'||sortKey==='入职时间'||sortKey==='预计解除合作时间'){return(toTs(a[sortKey])-toTs(b[sortKey]))*sortDir}return String(a[sortKey]).localeCompare(String(b[sortKey]),'zh',{numeric:true})*sortDir});curRows=l;cards(l);const ttl=l.length,tp=Math.max(1,Math.ceil(ttl/pageSize));if(page>tp)page=tp;if(page<1)page=1;const st=(page-1)*pageSize,sl=l.slice(st,st+pageSize);const tb=document.getElementById('tbody');tb.innerHTML=sl.length?sl.map(function(p){const hasAgree=/^https?:/i.test((p['解除协议']||'').trim());const agreeHtml=hasAgree?'<a class="btn-view has" onclick="viewAgreement(\''+encodeURIComponent(p['解除协议'])+'\',\''+p['骑手姓名']+'\',\''+p['市/区县']+'\',\''+p['站点']+'\')">查看</a>':'<span class="btn-view no">无</span>';return '<tr><td><span class="tag '+(p['区域']==='华东'?'hd':'hs')+'">'+p['区域']+'</span></td><td>'+p['提交时间']+'</td><td><b>'+p['市/区县']+'</b></td><td>'+p['站点']+'</td><td>'+p['骑手姓名']+'</td><td>'+maskId(p['骑手ID'])+'</td><td>'+p['解除合作原因']+'</td><td>'+p['解除合作去向']+'</td><td>'+agreeHtml+'</td></tr>';}).join(''):'<tr><td colspan="9" class="empty">无匹配记录</td></tr>';document.getElementById('meta').textContent='第 '+page+'/'+tp+' 页 · 显示 '+sl.length+' 条 · 共 '+ttl+' 条'+(q?' · 搜索"'+q+'"':'');let h='<button class="pbtn" '+(page<=1?'disabled':'')+' onclick="go(1)">\u00ab</button><button class="pbtn" '+(page<=1?'disabled':'')+' onclick="go('+(page-1)+')">\u2039上一页</button>';for(let i=Math.max(1,page-2);i<=Math.min(tp,page+2);i++){h+='<button class="pbtn '+(i===page?'cur':'')+'" onclick="go('+i+')">'+i+'</button>';}h+='<button class="pbtn" '+(page>=tp?'disabled':'')+' onclick="go('+(page+1)+')">下一页\u203a</button><button class="pbtn" '+(page>=tp?'disabled':'')+' onclick="go('+tp+')">\u00bb</button><span class="pinfo">共 '+ttl+' 条 · '+page+'/'+tp+'</span>';document.getElementById('pager').innerHTML=h;updateSortHeaders();}
function go(p){page=p;render();}
function viewAgreement(url,name,city,station){const realUrl=decodeURIComponent(url);const img=document.getElementById('modalImg');const err=document.getElementById('modalErr');err.style.display='none';img.style.display='';img.onload=function(){err.style.display='none';img.style.display=''};img.onerror=function(){img.style.display='none';err.style.display='block'};img.src=realUrl;document.getElementById('modalInfo').textContent=name+' · '+city+' · '+station;document.getElementById('modal').classList.add('show');}

/* ---- 协议图链接到期预警：问卷星签名 URL 含 Expires，临近到期（90 天内）或已过期时在页脚亮提示（R163 改由 boot 触发）---- */
function agreementExpiryWarn(){
  try{
    var exps=DATA.map(function(r){var m=/(?:\?|&)Expires=(\d+)/.exec(r['解除协议']||'');return m?+m[1]:0}).filter(Boolean);
    if(!exps.length)return;
    var min=new Date(Math.min.apply(null,exps)*1000),now=new Date();
    var d=Math.ceil((min-now)/86400000);
    var txt='⚠️ 协议原图为问卷星签名链接，预计 '+min.getFullYear()+'-'+String(min.getMonth()+1).padStart(2,'0')+'-'+String(min.getDate()).padStart(2,'0')+' 前后到期';
    if(d<0){document.getElementById('foot').innerHTML='<span style="color:#F5222D;font-weight:600">'+txt+'，已过期——请数据侧尽快转存为持久地址</span>';}
    else if(d<90){document.getElementById('foot').innerHTML='<span style="color:#D46B08;font-weight:600">'+txt+'（剩 '+d+' 天）——请数据侧提前转存为持久地址</span>';}
    else{document.getElementById('foot').innerHTML+=' · <span style="color:#8A8FA3">'+txt+'</span>';}
  }catch(e){}
}
