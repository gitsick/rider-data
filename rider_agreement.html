function updateFilters(){const fr=document.getElementById('fRegion').value;const fc=document.getElementById('fCity').value;const fst=document.getElementById('fStation').value;const fs=document.getElementById('fReason').value;let rd=DATA;if(fr)rd=rd.filter(r=>r['区域']===fr);const cities=[...new Set(rd.map(r=>r['市/区县']).filter(Boolean))].sort();const cs=document.getElementById('fCity');const keepCity=cities.includes(fc);cs.innerHTML='<option value="">全部市/区县</option>'+cities.map(c=>'<option value="'+c+'"'+(c===fc?' selected':'')+'>'+c+'</option>').join('');if(!keepCity)cs.value='';let cd=rd;const nc=cs.value;if(nc)cd=cd.filter(r=>r['市/区县']===nc);const stations=[...new Set(cd.map(r=>r['站点']).filter(Boolean))].sort();const ss=document.getElementById('fStation');const keepStation=stations.includes(fst);ss.innerHTML='<option value="">全部站点</option>'+stations.map(s=>'<option value="'+s+'"'+(s===fst?' selected':'')+'>'+s+'</option>').join('');if(!keepStation)ss.value='';let sd=cd;const nst=ss.value;if(nst)sd=sd.filter(r=>r['站点']===nst);const reasons=[...new Set(sd.map(r=>r['解除合作原因']).filter(Boolean))].sort();const rs=document.getElementById('fReason');const keepReason=reasons.includes(fs);rs.innerHTML='<option value="">全部解除原因</option>'+reasons.map(r=>'<option value="'+r+'"'+(r===fs?' selected':'')+'>'+r+'</option>').join('');if(!keepReason)rs.value='';}

function toTs(v){if(!v)return 0;const p=String(v).trim().split(/\s+/);const d=(p[0]||'0/0/0').split('/');const t=p[1]?p[1].split(':').map(Number):[0,0,0];return Date.UTC(+d[0],(+d[1]||1)-1,+d[2]||1,t[0]||0,t[1]||0,t[2]||0)}
function updateSortHeaders(){document.querySelectorAll('th').forEach(th=>{th.classList.remove('sort-asc','sort-desc');if(th.dataset.key===sortKey){th.classList.add(sortDir>0?'sort-asc':'sort-desc')}});}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const fr=document.getElementById('fRegion').value,fc=document.getElementById('fCity').value,fst=document.getElementById('fStation').value,fs=document.getElementById('fReason').value;const fa=document.getElementById('fHasAgree').value;let l=DATA.filter(r=>{if(fr&&r['区域']!==fr)return false;if(fc&&r['市/区县']!==fc)return false;if(fst&&r['站点']!==fst)return false;if(fs&&r['解除合作原因']!==fs)return false;if(fa==='yes'&&!(r['解除协议']&&r['解除协议'].trim()))return false;if(fa==='no'&&(r['解除协议']&&r['解除协议'].trim()))return false;if(q){const hay=Object.values(r).join(' ').toLowerCase();if(hay.indexOf(q)<0)return false;}return true;});if(sortKey)l=[...l].sort((a,b)=>{if(sortKey==='提交时间'||sortKey==='入职时间'||sortKey==='预计解除合作时间'){return(toTs(a[sortKey])-toTs(b[sortKey]))*sortDir}return String(a[sortKey]).localeCompare(String(b[sortKey]),'zh',{numeric:true})*sortDir});curRows=l;cards(l);const ttl=l.length,tp=Math.max(1,Math.ceil(ttl/pageSize));if(page>tp)page=tp;if(page<1)page=1;const st=(page-1)*pageSize,sl=l.slice(st,st+pageSize);const tb=document.getElementById('tbody');tb.innerHTML=sl.length?sl.map(function(p){const hasAgree=p['解除协议']&&p['解除协议'].trim();const agreeHtml=hasAgree?'<a class="btn-view has" onclick="viewAgreement(\''+encodeURIComponent(p['解除协议'])+'\',\''+p['骑手姓名']+'\',\''+p['市/区县']+'\',\''+p['站点']+'\')">查看</a>':'<span class="btn-view no">无</span>';return '<tr><td><span class="tag '+(p['区域']==='华东'?'hd':'hs')+'">'+p['区域']+'</span></td><td>'+p['提交时间']+'</td><td><b>'+p['市/区县']+'</b></td><td>'+p['站点']+'</td><td>'+p['骑手姓名']+'</td><td>'+p['骑手ID']+'</td><td>'+p['解除合作原因']+'</td><td>'+p['解除合作去向']+'</td><td>'+agreeHtml+'</td></tr>';}).join(''):'<tr><td colspan="9" class="empty">无匹配记录</td></tr>';document.getElementById('meta').textContent='第 '+page+'/'+tp+' 页 · 显示 '+sl.length+' 条 · 共 '+ttl+' 条'+(q?' · 搜索"'+q+'"':'');let h='<button class="pbtn" '+(page<=1?'disabled':'')+' onclick="go(1)">\u00ab</button><button class="pbtn" '+(page<=1?'disabled':'')+' onclick="go('+(page-1)+')">\u2039上一页</button>';for(let i=Math.max(1,page-2);i<=Math.min(tp,page+2);i++){h+='<button class="pbtn '+(i===page?'cur':'')+'" onclick="go('+i+')">'+i+'</button>';}h+='<button class="pbtn" '+(page>=tp?'disabled':'')+' onclick="go('+(page+1)+')">下一页\u203a</button><button class="pbtn" '+(page>=tp?'disabled':'')+' onclick="go('+tp+')">\u00bb</button><span class="pinfo">共 '+ttl+' 条 · '+page+'/'+tp+'</span>';document.getElementById('pager').innerHTML=h;updateSortHeaders();}
function go(p){page=p;render();}
function viewAgreement(url,name,city,station){const realUrl=decodeURIComponent(url);document.getElementById('modalImg').src=realUrl;document.getElementById('modalInfo').textContent=name+' · '+city+' · '+station;document.getElementById('modal').classList.add('show');}
function closeModal(e){if(e&&e.target!==document.getElementById('modal'))return;document.getElementById('modal').classList.remove('show');document.getElementById('modalImg').src='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function setSize(){pageSize=parseInt(document.getElementById('fPageSize').value)||15;page=1;render();}
document.getElementById('search').addEventListener('input',function(){page=1;render();});
document.getElementById('fRegion').addEventListener('change',function(){updateFilters();page=1;render();});
document.getElementById('fCity').addEventListener('change',function(){updateFilters();page=1;render();});
document.getElementById('fStation').addEventListener('change',function(){updateFilters();page=1;render();});
document.getElementById('fReason').addEventListener('change',function(){page=1;render();});
document.getElementById('fHasAgree').addEventListener('change',function(){page=1;render();});
document.getElementById('fPageSize').addEventListener('change',setSize);
document.querySelectorAll('th').forEach(th=>{if(th.dataset.key)th.addEventListener('click',()=>{const k=th.dataset.key;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}page=1;render();});});
function reset(){document.getElementById('search').value='';document.getElementById('fRegion').value='';document.getElementById('fCity').value='';document.getElementById('fStation').value='';document.getElementById('fReason').value='';document.getElementById('fHasAgree').value='';document.getElementById('fPageSize').value='15';pageSize=15;page=1;updateFilters();render();}
function init(){updateFilters();cards(DATA);page=1;pageSize=15;render();}
init();
</script></body></html>
